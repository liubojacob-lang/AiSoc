server {
    listen 80;
    server_name _;

    # security headers (TLS terminated at LB or via certbot in single-node)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 130s;   # LLM triage headroom
    }
    location /metrics {
        proxy_pass http://api:8000;
        allow 172.16.0.0/12;  allow 10.0.0.0/8;  allow 127.0.0.1;
        deny all;
    }
}
