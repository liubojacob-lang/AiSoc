[project]
name = "aisoc-backend"
version = "0.1.0"
description = "AISOC - AI-Powered Security Operations Center backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "python-multipart>=0.0.17",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
    "celery>=5.4",
    "httpx>=0.28",
    "cryptography>=43.0",
    "prometheus-client>=0.21",
    # PG 生产驱动与向量类型（本地无 PG 时代码路径仍可导入）
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-passlib",
]
devtools = ["watchfiles>=0.24"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs real Postgres/Redis (skipped in local sqlite runs)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "S"]
ignore = ["S101", "B008"]  # assert in tests; FastAPI Depends in defaults

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests_e2e/"]

[tool.ruff.lint.per-file-ignores]
# tests hold literal credentials for fixtures; randomness is for ids/backoff
"tests/*" = ["S105", "S311", "E501"]
# fake provider uses md5 as a lexical hash for embeddings (not security)
"app/modules/ai/providers/fake.py" = ["S324", "E501"]
# CJK docstrings make char-count limits noisy; formatting is enforced by `ruff format`
"app/*" = ["E501"]
