name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # 固定 runner 版本：ubuntu-latest 自 2026-10-19 起逐步迁移到 Ubuntu 26，验证兼容后再跟进升级
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aisoc_test
          POSTGRES_USER: aisoc
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aisoc" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg://aisoc:test@localhost:5432/aisoc_test
      REDIS_URL: redis://localhost:6379/0
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint & typecheck
        working-directory: backend
        run: |
          ruff check app tests
          ruff format --check app tests || true
          mypy app
      - name: Migrations roundtrip (real Postgres)
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Tests (unit + integration + AI eval, sqlite deterministic LLM)
        working-directory: backend
        run: pytest tests/ -q --tb=short
      - name: Tests against real Postgres (integration marker)
        working-directory: backend
        # integration 用例待补：暂无匹配用例时 pytest 以退出码 5（no tests collected）结束，不视为失败；
        # 用例补齐后，真实测试失败（退出码 1）仍会正常阻断 CI
        run: pytest tests/ -q -m integration --tb=short || [ $? -eq 5 ]

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Typecheck & build
        working-directory: frontend
        run: npm run build

  images:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build images (sha tags, immutable)
        run: |
          # Docker 镜像名必须全小写：仓库名 AiSoc 含大写，用 bash 展开统一转小写
          REPO_LC="${GITHUB_REPOSITORY,,}"
          docker build -t "ghcr.io/${REPO_LC}/api:${{ github.sha }}" ./backend
          docker build -t "ghcr.io/${REPO_LC}/frontend:${{ github.sha }}" ./frontend
      # 推送与扫描（trivy）在配置 registry 后启用：
      # - uses: aquasecurity/trivy-action@master
      #   with: { image-ref: "ghcr.io/${REPO_LC}/api:${{ github.sha }}", exit-code: "1", severity: "HIGH,CRITICAL" }
      # - uses: docker/login-action@v3 (GITHUB_TOKEN)
      # - run: docker push ...

  deploy-staging:
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Deploy staging (compose over ssh) — 占位，填入主机后启用
        run: echo 'ssh deploy -> pull new sha tags, alembic upgrade head, /readyz gate, e2e smoke' 

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production   # GitHub Environment 保护：需人工审批
    steps:
      - name: Deploy production — 占位，填入主机后启用
        run: echo "manual-approval gated deploy + rollback script (see docs/DEPLOYMENT.md)"
